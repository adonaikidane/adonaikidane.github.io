<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer cube wireframe, isometric-ish -->
  <!-- Back top edge -->
  <polyline points="4,10 16,4 28,10" stroke="#1a5c3a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left face -->
  <polyline points="4,10 4,22 16,28 16,16" stroke="#1a5c3a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right face -->
  <polyline points="28,10 28,22 16,28" stroke="#1a5c3a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Top face close -->
  <line x1="16" y1="4" x2="16" y2="16" stroke="#1a5c3a" stroke-width="1.5"/>
  <line x1="4" y1="10" x2="16" y2="16" stroke="#1a5c3a" stroke-width="1.5"/>
  <line x1="28" y1="10" x2="16" y2="16" stroke="#1a5c3a" stroke-width="1.5"/>
</svg>
